[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' https: data: https://via.placeholder.com; font-src 'self' https:;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
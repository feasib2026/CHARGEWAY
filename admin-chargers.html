<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Chargers - ChargeWay</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- Admin Sidebar -->
    <div class="admin-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">ChargeWay</span>
            </div>
            <button class="sidebar-close" onclick="toggleAdminSidebar()">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html" class="sidebar-link">
                <span class="sidebar-icon"></span>
                <span>Dashboard</span>
            </a>
            <a href="admin-bookings.html" class="sidebar-link">
                <span class="sidebar-icon"></span>
                <span>Bookings</span>
            </a>
            <a href="admin-chargers.html" class="sidebar-link active">
                <span class="sidebar-icon"></span>
                <span>Chargers</span>
            </a>
            <a href="admin-schedule.html" class="sidebar-link">
                <span class="sidebar-icon"></span>
                <span>Schedule</span>
            </a>
            <a href="admin-customers.html" class="sidebar-link">
                <span class="sidebar-icon"></span>
                <span>Customers</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" target="_blank" class="sidebar-link">
                <span class="sidebar-icon">🌐</span>
                <span>View Website</span>
            </a>
            <a href="#" class="sidebar-link logout" onclick="logout()">
                <span class="sidebar-icon">🚪</span>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <!-- Admin Main Content -->
    <div class="admin-main">
        <!-- Admin Header -->
        <header class="admin-header">
            <button class="sidebar-toggle" onclick="toggleAdminSidebar()">☰</button>
            <div class="header-content">
                <h1>Charger Management</h1>
                <p>View and manage charging machine and port status</p>
            </div>
            <div class="header-actions">
                <div class="admin-info">
                    <span class="admin-avatar">👤</span>
                    <span class="admin-name">Admin</span>
                </div>
            </div>
        </header>

        <!-- Chargers Content -->
        <main class="admin-content">
            <!-- Chargers Grid -->
            <div class="admin-chargers-grid" id="adminChargersGrid">
                <!-- Content will be loaded by JavaScript -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="admin-chargers.js"></script>
</body>
</html>
